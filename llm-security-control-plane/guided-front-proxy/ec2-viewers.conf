server {
  listen 19014;
  if ($guided_aux_host_allowed = 0) { return 421; }

  location / {
    limit_except GET { deny all; }
    set $viewer guided-promptfoo-ui:15500;
    proxy_pass http://$viewer;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
  }
}

server {
  listen 19015;
  if ($guided_aux_host_allowed = 0) { return 421; }

  location / {
    limit_except GET { deny all; }
    set $viewer guided-pyrit-ui:8000;
    proxy_pass http://$viewer;
